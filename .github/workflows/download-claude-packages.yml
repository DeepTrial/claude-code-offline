name: Download Claude Code Offline Packages

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if version exists'
        required: false
        default: 'true'
      specific_version:
        description: 'Build specific version (e.g., 2.1.79). Leave empty to use latest.'
        required: false
        default: ''
  # Daily check for new versions at 00:00 UTC
  # Weekly full rebuild every Monday at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'   # Daily
    - cron: '0 1 * * 1'   # Weekly (Monday 01:00, offset to avoid double-run)

env:
  # claude-code 2.x package.json engines require node >= 22 for the npm wrapper
  # path (the standalone native binary itself does NOT need Node.js).
  NODE_VERSION: '22'
  NODE_VERSIONS: '22,25'
  NPM_REGISTRY: 'https://registry.npmmirror.com'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      latest_version: ${{ steps.check.outputs.latest_version }}
      should_build: ${{ steps.check.outputs.should_build }}
      release_exists: ${{ steps.check.outputs.release_exists }}
    steps:
      - name: Install jq
        run: |
          sudo apt-get update && sudo apt-get install -y jq

      - name: Check latest version from npm
        id: check
        run: |
          set -e
          
          # Check if specific version was requested
          SPECIFIC_VERSION="${{ github.event.inputs.specific_version }}"
          FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}"
          
          if [ -n "$SPECIFIC_VERSION" ]; then
            echo "=== Building specific version: $SPECIFIC_VERSION ==="
            LATEST_VERSION="$SPECIFIC_VERSION"
          else
            echo "=== Checking latest version from npm ==="
            
            # Get latest version from npm
            NPM_RESPONSE=$(curl -s https://registry.npmjs.org/@anthropic-ai/claude-code)
            LATEST_VERSION=$(echo "$NPM_RESPONSE" | jq -r '.["dist-tags"].latest // empty')
            
            if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then
              echo "ERROR: Failed to get version from npm"
              echo "Response: $NPM_RESPONSE"
              exit 1
            fi
            
            echo "Latest npm version: $LATEST_VERSION"
          fi
          
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          
          # Check if release already exists
          echo "=== Checking if release exists ==="
          RELEASE_RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${LATEST_VERSION}")
          
          HTTP_CODE=$(echo "$RELEASE_RESPONSE" | tail -1)
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Release v${LATEST_VERSION} already exists"
            echo "release_exists=true" >> $GITHUB_OUTPUT
            
            # Check if force rebuild
            if [ "$FORCE_REBUILD" = "true" ]; then
              echo "Force rebuild requested"
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "Skipping build - version already exists"
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "Release v${LATEST_VERSION} does not exist"
            echo "release_exists=false" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "WARNING: Unexpected HTTP code $HTTP_CODE"
            echo "Assuming release does not exist, proceeding with build"
            echo "release_exists=false" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build-offline-packages:
    needs: check-version
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.should_build == 'true'
    permissions:
      contents: write
    
    steps:
      - name: Debug outputs
        run: |
          echo "Latest version: ${{ needs.check-version.outputs.latest_version }}"
          echo "Should build: ${{ needs.check-version.outputs.should_build }}"
          echo "Release exists: ${{ needs.check-version.outputs.release_exists }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq git

      - name: Configure npm mirrors
        run: |
          # Configure npm to use domestic mirror
          npm config set registry ${{ env.NPM_REGISTRY }}
          
          # Verify configuration
          echo "npm registry configured: $(npm config get registry)"

      - name: Download packages
        run: |
          set -e

          echo "=== Downloading packages as tarballs ==="

          # Use the version determined by check-version job
          TARGET_VERSION="${{ needs.check-version.outputs.latest_version }}"
          echo "Target version: $TARGET_VERSION"

          # Create working directory
          mkdir -p claude-offline-packages
          cd claude-offline-packages

          # Download packages as tarballs
          echo "=== Downloading @anthropic-ai/claude-code@${TARGET_VERSION} ==="
          npm pack "@anthropic-ai/claude-code@${TARGET_VERSION}" --pack-destination .
          CLAUDE_TGZ=$(ls -t anthropic-ai-claude-code-*.tgz 2>/dev/null | head -1 || true)
          # Rename to short name (matching 7z package)
          CLAUDE_VERSION="$TARGET_VERSION"
          mv "$CLAUDE_TGZ" "claude-code-${CLAUDE_VERSION}.tgz"
          echo "Downloaded: claude-code-${CLAUDE_VERSION}.tgz"

          # Get installed version for release
          echo "CLAUDE_VERSION=$CLAUDE_VERSION" >> $GITHUB_ENV
          echo "Building Claude Code version: $CLAUDE_VERSION"

          # Download optional dependencies that may be needed
          echo "=== Downloading additional dependencies ==="

          # Helper: pack and rename tarball
          # Usage: pack_rename <npm-package> <source-prefix> [target-prefix]
          # Example: pack_rename "@img/sharp-linux-x64" "img-sharp-linux-x64" "sharp-linux-x64"
          pack_rename() {
            local pkg="$1"
            local src_prefix="$2"
            local dst_prefix="${3:-$src_prefix}"
            npm pack "$pkg" --pack-destination . 2>/dev/null || { echo "$pkg not available"; return; }
            local orig
            orig=$(ls -t "${src_prefix}"-*.tgz 2>/dev/null | head -1 || true)
            if [ -n "$orig" ]; then
              local ver
              ver=$(echo "$orig" | sed "s/${src_prefix}-//" | sed 's/.tgz//')
              local dst="${dst_prefix}-${ver}.tgz"
              if [ "$orig" != "$dst" ]; then
                mv "$orig" "$dst"
              fi
            fi
          }

          pack_rename "@img/sharp-linux-x64" "img-sharp-linux-x64" "sharp-linux-x64"
          pack_rename "@img/sharp-libvips-linux-x64" "img-sharp-libvips-linux-x64" "sharp-libvips-linux-x64"
          pack_rename "@musistudio/claude-code-router" "musistudio-claude-code-router" "claude-code-router"

          echo "=== Downloaded packages (renamed to match 7z format) ==="
          ls -la *.tgz

      - name: Extract packages to node_modules
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/claude-offline-packages"

          echo "=== Installing packages to node_modules ==="

          # Create node_modules structure
          mkdir -p node_modules/.bin

          # Use npm install in a temp dir to get the full package with platform binaries
          CLAUDE_VERSION="${CLAUDE_VERSION:-${{ env.CLAUDE_VERSION }}}"
          echo "Installing @anthropic-ai/claude-code@${CLAUDE_VERSION} with full dependencies..."

          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"
          npm init -y > /dev/null 2>&1
          npm install "@anthropic-ai/claude-code@${CLAUDE_VERSION}" \
            --registry "${{ env.NPM_REGISTRY }}" 2>&1 || {
            echo "WARN: npm install failed, falling back to npm pack extraction"
            cd "$GITHUB_WORKSPACE/claude-offline-packages"
            CLAUDE_TGZ=$(ls -t claude-code-*.tgz 2>/dev/null | grep -v router | grep -v linux-x64 | head -1 || true)
            mkdir -p node_modules/@anthropic-ai/claude-code
            tar -xzf "$CLAUDE_TGZ" -C node_modules/@anthropic-ai/claude-code --strip-components=1
            TEMP_DIR=""
          }

          if [ -n "$TEMP_DIR" ] && [ -d "$TEMP_DIR/node_modules/@anthropic-ai/claude-code" ]; then
            cd "$GITHUB_WORKSPACE/claude-offline-packages"
            echo "Copying installed package..."

            # Copy main package
            mkdir -p node_modules/@anthropic-ai/claude-code
            cp -r "$TEMP_DIR/node_modules/@anthropic-ai/claude-code/"* node_modules/@anthropic-ai/claude-code/

            # Copy platform-specific binary packages (needed for native claude binary)
            for platform_pkg in "$TEMP_DIR"/node_modules/@anthropic-ai/claude-code-*/; do
              if [ -d "$platform_pkg" ]; then
                pkg_name=$(basename "$platform_pkg")
                echo "  Copying platform package: $pkg_name"
                mkdir -p "node_modules/@anthropic-ai/$pkg_name"
                cp -r "$platform_pkg"* "node_modules/@anthropic-ai/$pkg_name/" 2>/dev/null || true
              fi
            done

            rm -rf "$TEMP_DIR"
          fi

          # Place the native binary (postinstall may not run in CI)
          echo "=== Placing native binary ==="
          CLAUDE_CODE_DIR="$GITHUB_WORKSPACE/claude-offline-packages/node_modules/@anthropic-ai/claude-code"

          # Detect platform and architecture
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            PLATFORM_ARCH="x64"
          elif [ "$ARCH" = "aarch64" ]; then
            PLATFORM_ARCH="arm64"
          else
            PLATFORM_ARCH="$ARCH"
          fi
          echo "Platform: linux-${PLATFORM_ARCH}"

          # Find and copy the native binary
          PLATFORM_PKG="$GITHUB_WORKSPACE/claude-offline-packages/node_modules/@anthropic-ai/claude-code-linux-${PLATFORM_ARCH}"
          if [ -d "$PLATFORM_PKG" ] && [ -f "$PLATFORM_PKG/claude" ]; then
            echo "Found native binary: $PLATFORM_PKG/claude"
            cp "$PLATFORM_PKG/claude" "$CLAUDE_CODE_DIR/bin/claude.exe"
            chmod +x "$CLAUDE_CODE_DIR/bin/claude.exe"
            echo "Native binary placed at bin/claude.exe"
          else
            echo "WARN: Native binary not found at $PLATFORM_PKG/claude"
            echo "Available platform packages:"
            ls -d "$GITHUB_WORKSPACE/claude-offline-packages/node_modules/@anthropic-ai/claude-code-"* 2>/dev/null || echo "  None"
          fi

          # Create .bin launcher as a REAL script (never a symlink) so the
          # package survives extraction with Windows tools that drop symlinks
          # (printf instead of heredoc: heredoc delimiters cannot be indented
          # inside this YAML block scalar)
          echo "=== Creating .bin launcher script ==="
          cd "$GITHUB_WORKSPACE/claude-offline-packages/node_modules/.bin"
          rm -f claude
          if [ -f "../@anthropic-ai/claude-code/bin/claude.exe" ]; then
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              '# Claude Code launcher (generated at build time; real file, NOT a symlink)' \
              'SELF_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' \
              'exec "$SELF_DIR/../@anthropic-ai/claude-code/bin/claude.exe" "$@"' \
              > claude
            chmod +x claude
            echo "Created launcher: claude -> bin/claude.exe (real script)"
          elif [ -f "../@anthropic-ai/claude-code/cli-wrapper.cjs" ]; then
            printf '%s\n' \
              '#!/usr/bin/env node' \
              "require('../@anthropic-ai/claude-code/cli-wrapper.cjs');" \
              > claude
            chmod +x claude
            echo "Created launcher: claude -> cli-wrapper.cjs (node wrapper)"
          elif [ -f "../@anthropic-ai/claude-code/cli.js" ]; then
            printf '%s\n' \
              '#!/usr/bin/env node' \
              "require('../@anthropic-ai/claude-code/cli.js');" \
              > claude
            chmod +x claude
            echo "Created launcher: claude -> cli.js (node wrapper)"
          else
            echo "ERROR: No claude entry point found"
            exit 1
          fi
          if [ -f "../@musistudio/claude-code-router/dist/cli.js" ]; then
            ln -sf ../@musistudio/claude-code-router/dist/cli.js ccr
            chmod +x ccr
            echo "Created symlink: ccr -> cli.js"
          fi
          cd "$GITHUB_WORKSPACE/claude-offline-packages"

          # Extract @musistudio/claude-code-router (if exists)
          if ls claude-code-router-*.tgz 1>/dev/null 2>&1; then
            ROUTER_TGZ=$(ls -t claude-code-router-*.tgz 2>/dev/null | head -1 || true)
            echo "Extracting: $ROUTER_TGZ to node_modules/@musistudio/claude-code-router"
            mkdir -p node_modules/@musistudio/claude-code-router
            tar -xzf "$ROUTER_TGZ" -C node_modules/@musistudio/claude-code-router --strip-components=1
          fi

          # Extract @img/sharp-linux-x64 (if exists)
          if ls sharp-linux-x64-*.tgz 1>/dev/null 2>&1; then
            SHARP_TGZ=$(ls -t sharp-linux-x64-*.tgz 2>/dev/null | head -1 || true)
            echo "Extracting: $SHARP_TGZ to node_modules/@img/sharp-linux-x64"
            mkdir -p node_modules/@img/sharp-linux-x64
            tar -xzf "$SHARP_TGZ" -C node_modules/@img/sharp-linux-x64 --strip-components=1
          fi

          # Extract @img/sharp-libvips-linux-x64 (if exists)
          if ls sharp-libvips-linux-x64-*.tgz 1>/dev/null 2>&1; then
            SHARP_VIPS_TGZ=$(ls -t sharp-libvips-linux-x64-*.tgz 2>/dev/null | head -1 || true)
            echo "Extracting: $SHARP_VIPS_TGZ to node_modules/@img/sharp-libvips-linux-x64"
            mkdir -p node_modules/@img/sharp-libvips-linux-x64
            tar -xzf "$SHARP_VIPS_TGZ" -C node_modules/@img/sharp-libvips-linux-x64 --strip-components=1
          fi

          # Create package.json (for reference)
          CLAUDE_TGZ=$(ls -t claude-code-*.tgz 2>/dev/null | grep -v router | grep -v linux-x64 | head -1 || true)
          cat > package.json << EOF
          {
            "name": "claude-offline-packages",
            "version": "${CLAUDE_VERSION}",
            "private": true,
            "dependencies": {
              "@anthropic-ai/claude-code": "file:${CLAUDE_TGZ}"
            }
          }
          EOF

          # Create package-lock.json (empty for compatibility)
          echo '{}' > package-lock.json

          # Create deps-full.json for reference
          echo '{}' > deps-full.json

          echo "=== Final package structure ==="
          ls -la
          echo ""
          echo "=== node_modules structure ==="
          find node_modules -maxdepth 3 -type d | head -30
          echo ""
          echo "=== vendor binaries check ==="
          ls -la node_modules/@anthropic-ai/claude-code/vendor/ 2>/dev/null || echo "No vendor directory (may indicate npm pack fallback was used)"

      - name: Verify native binary (fail build on stub)
        run: |
          set -e
          BIN="$GITHUB_WORKSPACE/claude-offline-packages/node_modules/@anthropic-ai/claude-code/bin/claude.exe"
          if [ ! -f "$BIN" ]; then
            echo "ERROR: bin/claude.exe is missing from the package"
            exit 1
          fi
          SIZE=$(stat -c%s "$BIN")
          echo "bin/claude.exe size: $SIZE bytes"
          if [ "$SIZE" -le 104857600 ]; then
            echo "ERROR: bin/claude.exe is <= 100MB ($SIZE bytes) - this is a stub, not a real binary"
            exit 1
          fi
          echo "Running: $BIN --version"
          "$BIN" --version
          LAUNCHER="$GITHUB_WORKSPACE/claude-offline-packages/node_modules/.bin/claude"
          if [ -L "$LAUNCHER" ]; then
            echo "ERROR: .bin/claude is a symlink; it must be a real launcher script"
            exit 1
          fi
          [ -x "$LAUNCHER" ] || { echo "ERROR: .bin/claude is not executable"; exit 1; }
          echo "Binary self-check passed"

      - name: Download VSCode extension
        run: |
          echo "=== Downloading VSCode extension ==="
          cd "$GITHUB_WORKSPACE"
          
          # Method 1: Try OpenVSX (open source VSCode marketplace mirror)
          echo "Trying OpenVSX..."
          curl -L -o claude-offline-packages/anthropic.claude-code.vsix \
            "https://open-vsx.org/api/anthropic/claude-code/latest/file/anthropic.claude-code-latest.vsix" \
            --max-time 60 2>/dev/null || echo "OpenVSX download failed"
          
          # Check if download succeeded
          if [ -f "claude-offline-packages/anthropic.claude-code.vsix" ]; then
            FILE_SIZE=$(stat -c%s "claude-offline-packages/anthropic.claude-code.vsix" 2>/dev/null || echo "0")
            if [ "$FILE_SIZE" -gt 100000 ]; then
              echo "✓ VSCode extension downloaded from OpenVSX (${FILE_SIZE} bytes)"
            else
              echo "! File too small (${FILE_SIZE} bytes), trying alternative..."
              rm -f claude-offline-packages/anthropic.claude-code.vsix
            fi
          fi
          
          # Method 2: Try direct VSCode Marketplace with wget-style request
          if [ ! -f "claude-offline-packages/anthropic.claude-code.vsix" ]; then
            echo "Trying VSCode Marketplace directly..."
            
            # Get latest version first
            VERSION=$(curl -s "https://marketplace.visualstudio.com/items?itemName=anthropic.claude-code" 2>/dev/null | \
              grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
            
            if [ -n "$VERSION" ]; then
              echo "Found version: $VERSION"
              curl -L -H "User-Agent: Mozilla/5.0" \
                -o claude-offline-packages/anthropic.claude-code.vsix \
                "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/anthropic/vsextensions/claude-code/${VERSION}/vspackage" \
                --max-time 60 2>/dev/null || echo "Marketplace download failed"
            fi
          fi
          
          # Final check
          if [ -f "claude-offline-packages/anthropic.claude-code.vsix" ]; then
            FILE_SIZE=$(stat -c%s "claude-offline-packages/anthropic.claude-code.vsix" 2>/dev/null || echo "0")
            if [ "$FILE_SIZE" -gt 100000 ]; then
              echo "✓ VSCode extension ready (${FILE_SIZE} bytes)"
              ls -lh claude-offline-packages/anthropic.claude-code.vsix
            else
              echo "! Invalid file size (${FILE_SIZE} bytes), removing..."
              rm -f claude-offline-packages/anthropic.claude-code.vsix
            fi
          else
            echo "! Could not download VSCode extension automatically"
            echo "  Install manually: code --install-extension anthropic.claude-code"
          fi
        continue-on-error: true

      - name: Download offline skills and plugins
        run: |
          set -e
          echo "=== Downloading offline-compatible skills and plugins ==="
          cd "$GITHUB_WORKSPACE"

          # Verify jq and git are available
          echo "jq: $(which jq) ($(jq --version 2>/dev/null || echo 'not found'))"
          echo "git: $(which git)"
          echo "curl: $(which curl)"

          # Verify manifest exists and has plugins
          echo "=== Manifest check ==="
          echo "Manifest file: $(ls -la skills/skills-manifest.json)"
          echo "Plugin entries in manifest:"
          grep -B1 '"type": "plugin"' skills/skills-manifest.json | grep '"' | head -10

          # Create skills directory
          mkdir -p claude-offline-packages/skills/offline-skills

          # Use the download script which reads from manifest
          # This handles both skills and plugins automatically
          echo "=== Running download-skills.sh ==="
          bash skills/download-skills.sh claude-offline-packages/skills/offline-skills
          echo "Download script completed"

          # Copy install script and shared lib (manifest is already copied by download-skills.sh)
          cp skills/install-skills.sh claude-offline-packages/skills/
          chmod +x claude-offline-packages/skills/install-skills.sh
          cp -r skills/lib claude-offline-packages/skills/

          # Copy SKILLS-INDEX.md and skills-manifest.json to skills/ root level
          # (download-skills.sh puts them in offline-skills/, but they belong at skills/ level)
          if [ -f "claude-offline-packages/skills/offline-skills/SKILLS-INDEX.md" ]; then
            cp claude-offline-packages/skills/offline-skills/SKILLS-INDEX.md claude-offline-packages/skills/
          fi
          if [ -f "claude-offline-packages/skills/offline-skills/skills-manifest.json" ]; then
            cp claude-offline-packages/skills/offline-skills/skills-manifest.json claude-offline-packages/skills/
          fi

          echo "=== Skills and plugins download completed ==="
          echo "All entries in offline-skills:"
          ls -1 claude-offline-packages/skills/offline-skills 2>/dev/null
          echo ""
          echo "=== Checking for plugins ==="
          for plugin in superpowers everything-claude-code oh-my-claudecode; do
            if [ -d "claude-offline-packages/skills/offline-skills/$plugin" ]; then
              SIZE=$(du -sh "claude-offline-packages/skills/offline-skills/$plugin" | cut -f1)
              echo "  OK: $plugin ($SIZE)"
            else
              echo "  MISSING: $plugin"
            fi
          done

          # Verify manifest was copied to offline-skills
          echo ""
          echo "=== Manifest in offline-skills ==="
          ls -la claude-offline-packages/skills/offline-skills/skills-manifest.json 2>/dev/null || echo "  MISSING: skills-manifest.json in offline-skills/"

          du -sh claude-offline-packages/skills/

      - name: Download jq for offline use
        run: |
          set -e
          echo "=== Downloading jq for offline use ==="
          cd "$GITHUB_WORKSPACE"

          # Create bin directory
          mkdir -p claude-offline-packages/skills/bin

          # Download jq for all platforms using the download script
          bash skills/download-jq.sh --all claude-offline-packages/skills/bin

          echo "=== jq binaries downloaded ==="
          ls -la claude-offline-packages/skills/bin/
          echo ""
          echo "Platform directories:"
          ls -la claude-offline-packages/skills/bin/*/ 2>/dev/null || echo "  No platform directories found"

      - name: Copy setup script
        run: |
          echo "=== Copying setup script ==="
          
          # Ensure we're in the correct directory
          cd "$GITHUB_WORKSPACE"
          
          cp setup-claude-code.sh claude-offline-packages/
          chmod +x claude-offline-packages/setup-claude-code.sh
          
          if [ -f "check-update.sh" ]; then
            cp check-update.sh claude-offline-packages/
            chmod +x claude-offline-packages/check-update.sh
          fi
          
          echo "Files in package:"
          ls -la claude-offline-packages/
          
          # Verify VSCode extension is included
          if [ -f "claude-offline-packages/anthropic.claude-code.vsix" ]; then
            echo "✓ VSCode extension included in package"
          else
            echo "! VSCode extension not found in package"
          fi

      - name: Create package info
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          CLAUDE_VERSION="${{ env.CLAUDE_VERSION }}"
          
          cat > claude-offline-packages/package-info.json << EOF
          {
            "name": "claude-offline-packages",
            "version": "${CLAUDE_VERSION}",
            "created_at": "${BUILD_DATE}",
            "node_versions_supported": "${{ env.NODE_VERSIONS }}",
            "node_version_min": "22",
            "source": "https://www.npmjs.com/package/@anthropic-ai/claude-code",
            "github_repo": "${{ github.repository }}"
          }
          EOF
          
          echo "=== Package info ==="
          cat claude-offline-packages/package-info.json
          
          # Also create a node-versions.json for the setup script
          cat > claude-offline-packages/node-versions.json << EOF
          {
            "min_version": 18,
            "recommended": 22,
            "supported": [22, 25],
            "lts": [22],
            "note": "Native binary does not require Node.js; node >= 22 is only needed for the npm wrapper fallback (engines requirement)"
          }
          EOF

      - name: Pack offline packages
        run: |
          echo "=== Packing offline packages ==="
          
          # List all files before packing
          echo "Files to be packed:"
          ls -la claude-offline-packages/
          
          # Check if VSCode extension exists
          if [ -f "claude-offline-packages/anthropic.claude-code.vsix" ]; then
            echo "✓ VSCode extension will be included in the package"
          else
            echo "! Warning: VSCode extension not found"
          fi
          
          tar -czf claude-offline-packages.tar.gz claude-offline-packages/
          
          # Calculate checksum
          sha256sum claude-offline-packages.tar.gz > claude-offline-packages.tar.gz.sha256
          
          # Show package size
          echo "Package size:"
          ls -lh claude-offline-packages.tar.gz
          ls -lh claude-offline-packages.tar.gz.sha256
          
          # Verify archive contents
          echo "=== Verifying archive contents ==="
          echo "Looking for VSCode extension in archive:"
          tar -tzf claude-offline-packages.tar.gz | grep -i "vsix" || echo "! VSCode extension not found in archive"

      - name: Fetch Claude Code changelog
        id: changelog
        continue-on-error: true
        run: |
          CLAUDE_VERSION="${{ needs.check-version.outputs.latest_version }}"
          echo "=== Fetching changelog for Claude Code v${CLAUDE_VERSION} ==="

          # Download official changelog markdown from Claude Code docs
          CHANGELOG_URL="https://code.claude.com/docs/en/changelog.md"
          if ! curl -fsSL --max-time 30 "$CHANGELOG_URL" -o /tmp/changelog_full.md 2>/dev/null; then
            echo "has_changelog=false" >> $GITHUB_OUTPUT
            echo "Failed to download changelog from $CHANGELOG_URL"
            exit 0
          fi

          # Extract the section for the target version
          # Format: <Update label="X.Y.Z" description="Date">...content...</Update>
          # Uses sub() instead of match(array) for mawk compatibility on Ubuntu runners
          awk -v ver="$CLAUDE_VERSION" '
            BEGIN { found=0; buf="" }
            /<Update label="[^"]*"/ {
              v = $0
              sub(/.*label="/, "", v)
              sub(/".*/, "", v)
              if (v == ver) {
                found=1
                next
              }
            }
            /<\/Update>/ {
              if (found) {
                print buf
                exit 0
              }
            }
            found {
              # Strip leading "  * " bullet prefix to plain markdown
              gsub(/^  \* /, "- ")
              buf = buf $0 "\n"
            }
          ' /tmp/changelog_full.md > /tmp/changelog_body.md

          if [ -s /tmp/changelog_body.md ]; then
            CHANGELOG_LEN=$(wc -c < /tmp/changelog_body.md | tr -d ' ')
            echo "has_changelog=true" >> $GITHUB_OUTPUT
            echo "Changelog fetched for v${CLAUDE_VERSION} (${CHANGELOG_LEN} chars)"
          else
            echo "has_changelog=false" >> $GITHUB_OUTPUT
            echo "No changelog entry found for v${CLAUDE_VERSION}"
          fi

      - name: Generate release body
        run: |
          CLAUDE_VERSION="${{ needs.check-version.outputs.latest_version }}"
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          HAS_CHANGELOG="${{ steps.changelog.outputs.has_changelog }}"

          {
            echo "## Claude Code Offline Package v${CLAUDE_VERSION}"
            echo ""
            echo "**Version:** ${CLAUDE_VERSION}"
            echo "**Node.js:** ${{ env.NODE_VERSION }} (native binary runs WITHOUT Node.js)"
            echo "**Build Date:** ${BUILD_DATE}"
            echo ""

            # Append changelog if available
            if [ "$HAS_CHANGELOG" = "true" ] && [ -s /tmp/changelog_body.md ]; then
              echo "### What's New in Claude Code v${CLAUDE_VERSION}"
              echo ""
              cat /tmp/changelog_body.md
              echo ""
            fi

            echo "### Downloads"
            echo ""
            echo "| File | Platform | Description |"
            echo "|------|----------|-------------|"
            echo "| \`claude-offline-packages.tar.gz\` | Linux / macOS / WSL | Offline installation package |"
            echo "| \`claude-offline-packages.tar.gz.sha256\` | - | SHA256 checksum |"
            echo "| \`claude-offline-packages-windows.zip\` | Windows (native) | Offline installation package |"
            echo "| \`claude-offline-packages-windows.zip.sha256\` | - | SHA256 checksum |"
            echo ""
            echo "### Quick Start (Linux / macOS / WSL)"
            echo ""
            echo '```bash'
            echo "# 1. Download and extract"
            echo "tar -xzf claude-offline-packages.tar.gz"
            echo ""
            echo "# 2. Run installer (unattended: add --yes)"
            echo "cd claude-offline-packages"
            echo "bash setup-claude-code.sh"
            echo '```'
            echo ""
            echo "### Quick Start (Windows)"
            echo ""
            echo "1. Download \`claude-offline-packages-windows.zip\` and extract it"
            echo "2. Double-click \`setup-claude-code.bat\`, or run in PowerShell:"
            echo ""
            echo '```powershell'
            echo 'powershell -NoProfile -ExecutionPolicy Bypass -File .\setup-claude-code.ps1 -NonInteractive'
            echo '```'
            echo ""
            echo "The Windows package uses the standalone native binary (\`claude.exe\`);"
            echo "Node.js is NOT required. The installer adds the binary directory to your"
            echo "user PATH and creates \`%USERPROFILE%\.claude\settings.json\`."
            echo ""
            echo "### Verification"
            echo ""
            echo '```bash'
            echo "sha256sum -c claude-offline-packages.tar.gz.sha256"
            echo "sha256sum -c claude-offline-packages-windows.zip.sha256"
            echo '```'
            echo ""
            echo "### Package Contents"
            echo ""

            # Gather package metadata
            PKG_SIZE=$(du -sh claude-offline-packages.tar.gz 2>/dev/null | cut -f1 || echo "N/A")
            HAS_VSCODE=$(test -f claude-offline-packages/anthropic.claude-code.vsix && echo "✅ Included" || echo "❌ Not available")
            SKILL_COUNT=$(find claude-offline-packages/skills/offline-skills -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)
            JQ_PLATFORMS=$(ls claude-offline-packages/skills/bin/ 2>/dev/null | tr '\n' ', ' | sed 's/, $//')
            [ -z "$JQ_PLATFORMS" ] && JQ_PLATFORMS="N/A"

            echo "| Component | Detail |"
            echo "|-----------|--------|"
            echo "| Claude Code | v${CLAUDE_VERSION} |"
            echo "| Node.js Support | ${{ env.NODE_VERSIONS }} (optional; native binary needs no Node.js) |"
            echo "| Build Date | ${BUILD_DATE} |"
            echo "| Package Size | ${PKG_SIZE} |"
            echo "| VSCode Extension | ${HAS_VSCODE} |"
            echo "| Offline Skills | ${SKILL_COUNT} plugins |"
            echo "| jq Platforms | ${JQ_PLATFORMS} |"
            echo ""

            echo "**Includes:**"
            echo "- Claude Code CLI and platform-specific binaries"
            echo "- Offline-compatible skills and plugins"
            echo "- jq binaries for offline JSON processing"
            echo "- One-click setup script (\`setup-claude-code.sh\`)"
            echo "- Windows setup scripts (\`setup-claude-code.ps1\` / \`.bat\`, in the Windows zip)"
            echo "- Update checker (\`check-update.sh\`)"
            if [ -f claude-offline-packages/anthropic.claude-code.vsix ]; then
              echo "- VSCode extension (\`anthropic.claude-code.vsix\`)"
            fi
          } > release_body.md

          echo "=== Release body generated ==="
          cat release_body.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-offline-packages-v${{ needs.check-version.outputs.latest_version }}
          path: |
            claude-offline-packages.tar.gz
            claude-offline-packages.tar.gz.sha256
            release_body.md
          retention-days: 30

  build-windows-package:
    needs: check-version
    runs-on: windows-latest
    if: needs.check-version.outputs.should_build == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure npm registry
        run: |
          npm config set registry ${{ env.NPM_REGISTRY }}
          echo "npm registry configured: $(npm config get registry)"

      - name: Download npm packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${{ needs.check-version.outputs.latest_version }}"
          Write-Host "=== Downloading @anthropic-ai/claude-code@$ver (win32-x64 build) ==="
          New-Item -ItemType Directory -Path work -Force | Out-Null
          npm pack "@anthropic-ai/claude-code@$ver" --pack-destination work
          npm pack "@anthropic-ai/claude-code-win32-x64@$ver" --pack-destination work
          Get-ChildItem work\*.tgz | Select-Object Name, Length

      - name: Assemble windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${{ needs.check-version.outputs.latest_version }}"
          $root = "$env:GITHUB_WORKSPACE\claude-offline-packages-windows"
          $mainDir = "$root\node_modules\@anthropic-ai\claude-code"
          $platDir = "$root\node_modules\@anthropic-ai\claude-code-win32-x64"
          New-Item -ItemType Directory -Path $mainDir, $platDir -Force | Out-Null

          $mainTgz = Get-ChildItem "work\anthropic-ai-claude-code-$ver.tgz" | Select-Object -First 1
          $platTgz = Get-ChildItem "work\anthropic-ai-claude-code-win32-x64-$ver.tgz" | Select-Object -First 1
          Write-Host "Extracting $($mainTgz.Name) -> main package"
          tar -xzf $mainTgz.FullName -C $mainDir --strip-components=1
          Write-Host "Extracting $($platTgz.Name) -> win32-x64 package"
          tar -xzf $platTgz.FullName -C $platDir --strip-components=1

          # Replace the placeholder stub with the real Windows PE binary
          Copy-Item "$platDir\claude.exe" "$mainDir\bin\claude.exe" -Force

          # Self-check: binary must be > 100MB (the npm stub is only ~500 bytes)
          $size = (Get-Item "$mainDir\bin\claude.exe").Length
          Write-Host "bin\claude.exe size: $size bytes"
          if ($size -le 100MB) {
            Write-Error "bin\claude.exe is a stub ($size bytes), not a real Windows binary"
            exit 1
          }
          & "$mainDir\bin\claude.exe" --version
          if ($LASTEXITCODE -ne 0) { Write-Error "claude.exe --version failed"; exit 1 }

      - name: Download offline skills and plugins
        shell: bash
        run: |
          set -e
          echo "=== Downloading offline-compatible skills and plugins (windows package) ==="
          # jq is required by download-skills.sh; install if missing
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found, installing via chocolatey..."
            choco install jq -y --no-progress
          fi
          mkdir -p claude-offline-packages-windows/skills/offline-skills
          bash skills/download-skills.sh claude-offline-packages-windows/skills/offline-skills
          cp skills/install-skills.sh claude-offline-packages-windows/skills/
          cp -r skills/lib claude-offline-packages-windows/skills/
          for f in SKILLS-INDEX.md skills-manifest.json; do
            if [ -f "claude-offline-packages-windows/skills/offline-skills/$f" ]; then
              cp "claude-offline-packages-windows/skills/offline-skills/$f" claude-offline-packages-windows/skills/
            fi
          done
          du -sh claude-offline-packages-windows/skills/

      - name: Download jq for windows
        shell: bash
        run: |
          set -e
          echo "=== Downloading jq (windows-amd64) for offline use ==="
          mkdir -p /tmp/jqdl
          bash skills/download-jq.sh --all /tmp/jqdl
          mkdir -p claude-offline-packages-windows/skills/bin/windows-amd64
          cp /tmp/jqdl/windows-amd64/jq.exe claude-offline-packages-windows/skills/bin/windows-amd64/
          ls -la claude-offline-packages-windows/skills/bin/windows-amd64/

      - name: Copy setup scripts and package info
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:GITHUB_WORKSPACE\claude-offline-packages-windows"
          Copy-Item setup-claude-code.ps1, setup-claude-code.bat $root
          $info = [ordered]@{
            name = 'claude-offline-packages-windows'
            version = "${{ needs.check-version.outputs.latest_version }}"
            created_at = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platform = 'win32-x64'
            node_versions_supported = '${{ env.NODE_VERSIONS }}'
            node_version_min = '22'
            source = 'https://www.npmjs.com/package/@anthropic-ai/claude-code'
            github_repo = '${{ github.repository }}'
          }
          ($info | ConvertTo-Json) | Out-File -FilePath "$root\package-info.json" -Encoding utf8
          Get-Content "$root\package-info.json"

      - name: Zip package and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path claude-offline-packages-windows -DestinationPath claude-offline-packages-windows.zip -Force
          $hash = (Get-FileHash claude-offline-packages-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  claude-offline-packages-windows.zip" | Out-File -FilePath claude-offline-packages-windows.zip.sha256 -Encoding ascii
          Get-Item claude-offline-packages-windows.zip | Select-Object Name, Length
          Get-Content claude-offline-packages-windows.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-offline-packages-windows-v${{ needs.check-version.outputs.latest_version }}
          path: |
            claude-offline-packages-windows.zip
            claude-offline-packages-windows.zip.sha256
          retention-days: 30

  test-release-package:
    needs: [check-version, build-offline-packages, build-windows-package]
    runs-on: ${{ matrix.os }}
    if: needs.check-version.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            part: linux
          - os: windows-latest
            part: windows
    steps:
      - name: Checkout repository (test scripts)
        uses: actions/checkout@v4

      # ---------------- Linux part ----------------
      - name: Download linux artifact
        if: matrix.part == 'linux'
        uses: actions/download-artifact@v4
        with:
          name: claude-offline-packages-v${{ needs.check-version.outputs.latest_version }}
          path: artifacts

      - name: Extract linux package
        if: matrix.part == 'linux'
        run: |
          set -e
          tar -xzf artifacts/claude-offline-packages.tar.gz -C .
          ls claude-offline-packages/

      - name: Run linux package tests
        if: matrix.part == 'linux'
        run: |
          chmod +x tests/test-linux-package.sh
          bash tests/test-linux-package.sh "$GITHUB_WORKSPACE/claude-offline-packages" "${{ needs.check-version.outputs.latest_version }}"

      # ---------------- Windows part ----------------
      - name: Download windows artifact
        if: matrix.part == 'windows'
        uses: actions/download-artifact@v4
        with:
          name: claude-offline-packages-windows-v${{ needs.check-version.outputs.latest_version }}
          path: artifacts

      - name: Extract windows package
        if: matrix.part == 'windows'
        shell: pwsh
        run: |
          Expand-Archive -Path artifacts\claude-offline-packages-windows.zip -DestinationPath . -Force
          Get-ChildItem claude-offline-packages-windows

      - name: Run windows package tests
        if: matrix.part == 'windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\test-windows-package.ps1 `
            -PackageDir "$env:GITHUB_WORKSPACE\claude-offline-packages-windows" `
            -ExpectedVersion "${{ needs.check-version.outputs.latest_version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  create-release:
    needs: [check-version, test-release-package]
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.should_build == 'true'
    permissions:
      contents: write
    steps:
      - name: Download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: claude-offline-packages-v${{ needs.check-version.outputs.latest_version }}
          path: dist

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: claude-offline-packages-windows-v${{ needs.check-version.outputs.latest_version }}
          path: dist

      - name: Verify release files
        run: |
          set -e
          ls -lh dist/
          for f in claude-offline-packages.tar.gz claude-offline-packages.tar.gz.sha256 \
                   claude-offline-packages-windows.zip claude-offline-packages-windows.zip.sha256 \
                   release_body.md; do
            if [ ! -f "dist/$f" ]; then
              echo "ERROR: missing release file: dist/$f"
              exit 1
            fi
          done
          echo "All release files present"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-version.outputs.latest_version }}
          name: Claude Code v${{ needs.check-version.outputs.latest_version }}
          body_path: dist/release_body.md
          draft: false
          prerelease: false
          files: |
            dist/claude-offline-packages.tar.gz
            dist/claude-offline-packages.tar.gz.sha256
            dist/claude-offline-packages-windows.zip
            dist/claude-offline-packages-windows.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup-old-releases:
    needs: [check-version, create-release]
    runs-on: ubuntu-latest
    if: always() && needs.check-version.outputs.should_build == 'true'
    permissions:
      contents: write
    steps:
      - name: Cleanup old releases (keep latest 10)
        run: |
          echo "=== Cleaning up old releases (keeping latest 10) ==="
          
          # Get all releases sorted by creation date (newest first), exclude the latest 10
          RELEASES_TO_DELETE=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" | \
            jq -r '.[10:] | .[] | select(.tag_name | startswith("v")) | .id' 2>/dev/null)
          
          if [ -z "$RELEASES_TO_DELETE" ]; then
            echo "No old releases to delete (less than 10 releases exist)"
            exit 0
          fi
          
          echo "Releases to delete:"
          echo "$RELEASES_TO_DELETE"
          
          # Delete each old release
          for RELEASE_ID in $RELEASES_TO_DELETE; do
            echo "Deleting release ID: $RELEASE_ID"
            curl -s -X DELETE \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            
            # Also delete the tag
            TAG_NAME=$(curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID" | \
              jq -r '.tag_name' 2>/dev/null)
            if [ -n "$TAG_NAME" ] && [ "$TAG_NAME" != "null" ]; then
              echo "Deleting tag: $TAG_NAME"
              curl -s -X DELETE \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$TAG_NAME" 2>/dev/null || true
            fi
          done
          
          echo "Cleanup completed"

  notify-no-build:
    needs: check-version
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.should_build == 'false'
    steps:
      - name: Skip notification
        run: |
          echo "Skipping build - version ${{ needs.check-version.outputs.latest_version }} already exists"
          echo "To force rebuild, trigger workflow with 'force_rebuild' set to 'true'"
          echo "To build a specific version, use the 'specific_version' input (e.g., '2.1.79')"
